{% extends "base.html" %}
{% block title %}Register Employee - Cafe HRMS{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-title-group">
        <h1>Register New Employee</h1>
        <p class="page-subtitle">Create a user account for a new barista or staff member.</p>
    </div>
    <div class="page-actions">
        <a href="{% url 'employee_list' %}" class="btn btn-secondary">&larr; Back to Employee List</a>
    </div>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <h3 style="font-size: 16px; margin-bottom: 18px; color: var(--cafe-espresso); border-bottom: 1px solid var(--cafe-border); padding-bottom: 8px;">
            Account Information
        </h3>
        
        {{ form.as_p }}

        <div class="form-actions">
            <a href="{% url 'employee_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Account &amp; Proceed &rarr;</button>
        </div>
    </form>
</div>
{% endblock %}
