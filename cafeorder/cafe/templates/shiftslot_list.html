{% extends "base.html" %}
{% block content %}
<h2>Shift Slots</h2>
<a href="{% url 'shiftslot_create' %}">Add Slot</a>
<table border="1">
    <tr><th>Name</th><th>Start</th><th>End</th></tr>
    {% for slot in slots %}
    <tr><td>{{ slot.name }}</td><td>{{ slot.start_time }}</td><td>{{ slot.end_time }}</td></tr>
    {% empty %}
    <tr><td colspan="3">No shift slots yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
