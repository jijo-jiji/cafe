{% extends "base.html" %}

{% block title %}Register Worker{% endblock %}

{% block content %}
<h1>Register a Worker</h1>

{% if form.errors %}
    <p style="color: red;">Please correct the errors below.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
</form>
{% endblock %}
