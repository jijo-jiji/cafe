<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
  <defs>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5b4c" />
      <stop offset="50%" stop-color="#5c382a" />
      <stop offset="100%" stop-color="#382218" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Cup Icon Background -->
  <g transform="translate(10, 10)">
    <circle cx="35" cy="35" r="34" fill="url(#coffeeGrad)" />
    <!-- Coffee Cup Graphic -->
    <path d="M22 25 L48 25 C48 38 43 47 35 47 C27 47 22 38 22 25 Z" fill="#ffffff" />
    <path d="M48 29 C53 29 56 32 56 36 C56 40 52 42 48 42" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Steam Lines -->
    <path d="M28 19 C26 15 30 13 28 9" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M35 20 C33 16 37 14 35 10" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M42 19 C40 15 44 13 42 9" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Saucer -->
    <ellipse cx="35" cy="51" rx="19" ry="3" fill="#e2d4c9" />
  </g>

  <!-- Typography -->
  <text x="92" y="44" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#2d1a12" letter-spacing="-0.5">
    CAFE<tspan fill="#d97706">HRMS</tspan>
  </text>
  <text x="93" y="63" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#8d5b4c" letter-spacing="2.2">
    STAFF &amp; ROSTER MANAGEMENT
  </text>
</svg>
